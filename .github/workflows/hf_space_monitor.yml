name: HF Space keep-alive and health monitor

on:
  schedule:
    # Every 30 minutes. The Space sleeps after 48h without traffic
    # (gcTimeout=172800, fixed on free cpu-basic hardware), so each run
    # pings it to reset that timer, and wakes it if it slept anyway.
    # GitHub may delay scheduled runs by a few minutes.
    # NOTE: GitHub disables scheduled workflows in repositories with no
    # activity for 60 days, silently. If the repo goes quiet after the
    # thesis is handed in, re-enable this from the Actions tab.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A run stuck waiting for a hosted runner can overrun the next cron tick.
# Without this, two runs could evaluate and restart the same Space at once.
concurrency:
  group: hf-space-monitor
  cancel-in-progress: false

jobs:
  check-space:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout keep-alive script
        uses: actions/checkout@v4
        with:
          sparse-checkout: huggingface

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --quiet "huggingface_hub>=0.23"

      - name: Ping the Space, waking or restarting it if needed
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Each Actions run is a fresh VM, so the local cooldown state file
        # never persists here; the 30-minute cron interval IS the cooldown.
        run: |
          set +e
          python huggingface/hf_space_monitor.py \
            --space pinthoz/attention-atlas --min-gap-minutes 0 2>&1 | tee monitor.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = healthy and pinged. 4 = it had gone to sleep and was woken;
          # routine, so it is summarised but raises nothing. 3 = restarted out
          # of an error state: not a failure, but it must not pass silently
          # either, so the step below records it. Anything else is a real
          # problem and should fail the run.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ] && [ "$code" -ne 4 ]; then
            exit "$code"
          fi

      - name: Note the wake-up on the run summary
        if: steps.check.outputs.code == '4'
        run: |
          {
            echo "The Space had gone to sleep and was woken."
            echo
            echo '```'
            cat monitor.log
            echo '```'
            echo
            echo "It takes a few minutes to serve again. If this shows up on"
            echo "most runs, the keep-alive ping is not reaching the app -"
            echo "check the ping line on a healthy run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the restart in a tracking issue
        if: steps.check.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "HF Space health monitor: automatic restart issued"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The monitor found the Space in a restartable error stage and"
            echo "issued a restart."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            cat monitor.log
            echo '```'
            echo
            echo "Every restart adds a comment here. Several comments in a row mean"
            echo "the restart is **not** fixing the Space and it needs to be looked"
            echo "at by hand: https://huggingface.co/spaces/pinthoz/attention-atlas"
            echo
            echo "Close this issue once the Space is healthy again; the monitor will"
            echo "open a fresh one the next time it has to restart."
          } > issue-body.md

          # Also surface it on the run page, so the restart is visible even if
          # the issue write below fails.
          cat issue-body.md >> "$GITHUB_STEP_SUMMARY"

          num=$(gh issue list --state open --limit 100 --json number,title \
                --jq '[.[] | select(.title == env.TITLE)][0].number // empty')

          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file issue-body.md
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
